[package]
name = "vp-client-ios"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[target.'cfg(target_os = "ios")'.dependencies]
vp-client-mobile-ui = { path = "../../crates/vp-client-mobile-ui" }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "wgpu"] }

# Separate native dependency resolution; glutin must not enter this Metal build.
[workspace]
resolver = "2"
