[package]
name = "vp-client-ios"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[target.'cfg(target_os = "ios")'.dependencies]
vp-client-mobile-ui = { path = "../../crates/vp-client-mobile-ui", default-features = false, features = ["rendering"] }
vp-client-core = { path = "../../crates/vp-client-core" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "=1.24.0", features = ["v4"] }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "wgpu"] }

# Separate native dependency resolution; glutin must not enter this Metal build.
[workspace]
resolver = "2"
