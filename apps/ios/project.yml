# Source project specification for XcodeGen; not generated or built in Linux.
name: VPNParser
options:
  bundleIdPrefix: org.vpnparser.client
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    SWIFT_VERSION: '5.0'
    ENABLE_BITCODE: NO
targets:
  VPNParser:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VPN Parser
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.vpnparser.client
        # Supply the archive for the selected SDK before linking; no build script.
        LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(PROJECT_DIR)/Rust/$(PLATFORM_NAME)']
        OTHER_LDFLAGS: ['$(inherited)', '-lvp_client_ios', '-lc++', '-liconv']
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreFoundation.framework
    # Extension deliberately not embedded: shipping a nonfunctional VPN is unsafe.
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [PacketTunnel]
    info:
      path: PacketTunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.vpnparser.client.PacketTunnel
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
    dependencies:
      - sdk: NetworkExtension.framework
schemes:
  VPNParser:
    build:
      targets:
        VPNParser: all
  PacketTunnelBoundary:
    build:
      targets:
        PacketTunnel: all
