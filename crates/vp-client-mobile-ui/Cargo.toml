[package]
name = "vp-client-mobile-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
vp-client-core = { path = "../vp-client-core" }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts"], optional = true }
once_cell = { version = "1.21", optional = true }

[features]
default = ["rendering"]
rendering = ["dep:eframe", "dep:once_cell"]
