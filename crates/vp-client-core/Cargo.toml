[package]
name = "vp-client-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared pure configuration and routing models for VPN Parser clients"
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }

serde_json = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
once_cell = "1.21"
percent-encoding = "2.3"
regex = "1.13"
